<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Fluid Simulation</title>

        <meta name="description" content="Real-time particle-based 3D fluid simulation and rendering using WebGL.">

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="flip.css"/>
    </head>

    <body>
        <script type="text/template" id="main">
            <style>
                .editing-ui {
                    display: none;
                }

                .simulating-ui {
                    display: none;
                }
            </style>

            <canvas id="canvas" width="1920" height="1080"></canvas>
            <canvas id="overlay-canvas" class="simulating-ui"></canvas>
            
            <div id="ui">
                <a href="index.html" id="back-button" style="
                    display: block;
                    color: var(--text-dim);
                    text-decoration: none;
                    font-size: 13px;
                    font-weight: 500;
                    margin-bottom: 8px;
                    pointer-events: auto;
                    transition: color 0.2s;
                ">← Menu</a>

                <div id="start-button">Start</div>

                <div id="preset-button" class="editing-ui">Random Preset</div>
                
                <div class="slider-label editing-ui">Particle Density</div>
                <div id="density-slider" class="slider editing-ui"></div>

                <div id="particle-count" class="editing-ui"></div>

                <div class="slider-label simulating-ui">Color</div>
                <input type="color" id="color-picker" class="simulating-ui" value="#00bbff">

                <div class="slider-label simulating-ui">Fluidity</div>
                <div id="fluidity-slider" class="slider simulating-ui"></div>

                <div class="slider-label simulating-ui">Speed</div>
                <div id="speed-slider" class="slider simulating-ui"></div>

                <div class="control-row simulating-ui">
                    <button id="gravity-button" class="action-btn">Gravity: Normal</button>
                </div>
            </div>

            <!-- New Physics Right Bar -->
            <div id="right-bar" class="simulating-ui">
                <div class="right-bar-section">
                    <div class="right-bar-label">Explode Force</div>
                    <div id="explode-slider" class="slider"></div>
                    <button id="explode-button" class="action-btn right-btn">💥 Explode!</button>
                </div>
                
                <div class="right-bar-divider"></div>
                
                <div class="right-bar-section">
                    <div class="right-bar-label">Placeable Tools <span id="source-count-badge" class="source-badge">0</span></div>
                    <div class="right-bar-tools">
                        <button id="tool-none-button" class="action-btn right-btn active-tool" data-tooltip="Select / Delete sources">🚫 None</button>
                        <button id="tool-vortex-button" class="action-btn right-btn" data-tooltip="Creates a swirling vortex that pulls particles inward">🌀 Vortex</button>
                        <button id="tool-wind-button" class="action-btn right-btn" data-tooltip="Click & drag to set wind direction. Blows particles along a cone">💨 Wind</button>
                        <button id="tool-repel-button" class="action-btn right-btn" data-tooltip="Pushes particles away from the source">🔵 Repel</button>
                        <button id="tool-blackhole-button" class="action-btn right-btn" data-tooltip="Sucks in particles with gravitational & orbital forces">🕳️ Black Hole</button>
                        <button id="tool-fountain-button" class="action-btn right-btn" data-tooltip="Shoots particles upward in a column">⛲ Fountain</button>
                        <button id="tool-turbulence-button" class="action-btn right-btn" data-tooltip="Creates chaotic, swirling random forces">🌊 Turbulence</button>
                        <button id="tool-wave-button" class="action-btn right-btn" data-tooltip="Generates concentric wave pulses">〰️ Wave</button>
                        <button id="tool-magnet-button" class="action-btn right-btn" data-tooltip="Gently attracts nearby particles — softer than black hole">🧲 Magnet</button>
                    </div>
                </div>

                <div class="right-bar-divider"></div>

                <div class="right-bar-section">
                    <div class="right-bar-label">Tool Strength</div>
                    <div id="strength-slider" class="slider"></div>
                </div>

                <div class="right-bar-divider"></div>

                <div class="right-bar-section">
                    <button id="clear-sources-button" class="action-btn right-btn danger-btn">🗑️ Clear All Sources</button>
                </div>
            </div>
            </div>


            <div class="instructions editing-ui">
                <span>Space + drag</span> to rotate camera <br/>
                <span>Scroll</span> to zoom in and out <br/>
                <br/>
                <span>Draw on walls</span> to create new boxes <br/>
                <span>Drag box faces</span> to resize <br/>
                <span>Shift + drag box faces</span> to translate <br/>
            </div>

            <div class="instructions simulating-ui">
                <span>Drag</span> to rotate camera<br/>
                <span>Scroll</span> to zoom in and out <br/>
                <span>Move mouse</span> to push particles<br/>
                <span>Click</span> to place selected tool<br/>
                <span>Wind tool:</span> click & drag to set direction<br/>
                <span>None tool + click source</span> to delete it
            </div>

            <div id="footer"></div>
        </script>

        <script type="text/template" id="no-support">
            <div id="container">
                <div id="error"></div>
            </div>
        </script>


        <div id="placeholder"></div>


        <script src="wrappedgl.js"></script>
        <script src="utilities.js"></script>
        <script src="camera.js"></script>
        <script src="boxeditor.js"></script>
        <script src="simulator.js"></script>
        <script src="renderer.js"></script>
        <script src="simulatorrenderer.js"></script>
        <script src="slider.js"></script>
        <script src="fluidparticles.js"></script>

        <script>
            function concatenateWords (list) {
                if (list.length === 0) {
                    return '';
                } else if (list.length === 1) {
                    return "'" + list[0] + "'";
                } else {
                    var result = '';
                    for (var i = 0; i < list.length; ++i) {
                        result += "'" + list[i] + "'";
                        if (i < list.length - 1) {
                            result += i < list.length - 2 ? ', ' : ' and '
                        }
                    }

                    return result;
                }
            }

            WrappedGL.checkWebGLSupportWithExtensions(['ANGLE_instanced_arrays', 'WEBGL_depth_texture', 'OES_texture_float', 'OES_texture_float_linear', 'OES_texture_half_float', 'OES_texture_half_float_linear'],
                function () { //we have webgl
                    document.getElementById('placeholder').outerHTML = document.getElementById('main').innerHTML;
                    var fluidBox = new FluidParticles();
                }, function (hasWebGL, unsupportedExtensions) {
                    document.getElementById('placeholder').outerHTML = document.getElementById('no-support').innerHTML;
                    if (!hasWebGL) { //webgl not supported
                        document.getElementById('error').textContent = 'Unfortunately, your browser does not support WebGL';
                    } else {
                        document.getElementById('error').textContent = 'Unfortunately, your browser does not support the ' + concatenateWords(unsupportedExtensions) + " WebGL extension" + (unsupportedExtensions.length > 1 ? 's.' : '.');
                    }
                }
            );
        </script>
    </body>


</html>
