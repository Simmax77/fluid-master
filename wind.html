<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Wind Tunnel - Particle Lab</title>
    <meta name="description"
        content="3D wind tunnel simulation with placeable obstacles using WebGL particle rendering.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="wind.css" />
</head>

<body>
    <script type="text/template" id="main">
            <canvas id="canvas" width="1920" height="1080"></canvas>
            <canvas id="overlay-canvas"></canvas>

            <div id="ui">
                <a href="index.html" id="back-button">← Menu</a>

                <div class="slider-label">Wind Speed</div>
                <div id="wind-speed-slider" class="slider"></div>

                <div class="slider-label">Color</div>
                <input type="color" id="color-picker" value="#00bbff">

                <div class="slider-label">Particle Size</div>
                <div id="size-slider" class="slider"></div>

                <div class="control-row">
                    <button id="gravity-button" class="action-btn">Gravity: Zero</button>
                </div>
            </div>

            <!-- Obstacle Tools Right Bar -->
            <div id="right-bar">
                <div class="right-bar-section">
                    <div class="right-bar-label">Obstacles <span id="obstacle-count-badge" class="source-badge empty">0</span></div>
                    <div class="right-bar-tools">
                        <button id="tool-none-button" class="action-btn right-btn active-tool" data-tooltip="Select / Delete obstacles">🚫 None</button>
                        <button id="tool-block-button" class="action-btn right-btn" data-tooltip="Rectangular solid wall">📦 Block</button>
                        <button id="tool-ball-button" class="action-btn right-btn" data-tooltip="Spherical obstacle — smooth flow deflection">⚽ Ball</button>
                        <button id="tool-triangle-button" class="action-btn right-btn" data-tooltip="Wedge-shaped obstacle — splits the flow">🔺 Triangle</button>
                        <button id="tool-airfoil-button" class="action-btn right-btn" data-tooltip="Teardrop wing profile — aerodynamic shape">✈️ Airfoil</button>
                        <button id="tool-diamond-button" class="action-btn right-btn" data-tooltip="Diamond-shaped obstacle — angled surfaces">💎 Diamond</button>
                        <button id="tool-plate-button" class="action-btn right-btn" data-tooltip="Thin vertical wall — high drag, creates wake">🪧 Flat Plate</button>
                    </div>
                </div>

                <div class="right-bar-divider"></div>

                <div class="right-bar-section">
                    <div class="right-bar-label">Obstacle Size</div>
                    <div id="obstacle-size-slider" class="slider"></div>
                </div>

                <div class="right-bar-divider"></div>

                <div class="right-bar-section">
                    <button id="clear-obstacles-button" class="action-btn right-btn danger-btn">🗑️ Clear All Obstacles</button>
                </div>
            </div>

            <div class="instructions">
                <span>Click</span> to place selected obstacle<br/>
                <span>None tool + click obstacle</span> to delete it<br/>
                <span>Drag</span> to rotate camera<br/>
                <span>Scroll</span> to zoom in and out
            </div>

            <div id="footer"></div>
        </script>

    <script type="text/template" id="no-support">
            <div id="container">
                <div id="error"></div>
            </div>
        </script>

    <div id="placeholder"></div>

    <script src="wrappedgl.js"></script>
    <script src="utilities.js"></script>
    <script src="camera.js"></script>
    <script src="renderer.js"></script>
    <script src="slider.js"></script>
    <script src="windsimulator.js"></script>
    <script src="windsimulatorrenderer.js"></script>
    <script src="windparticles.js"></script>

    <script>
        function concatenateWords(list) {
            if (list.length === 0) {
                return '';
            } else if (list.length === 1) {
                return "'" + list[0] + "'";
            } else {
                var result = '';
                for (var i = 0; i < list.length; ++i) {
                    result += "'" + list[i] + "'";
                    if (i < list.length - 1) {
                        result += i < list.length - 2 ? ', ' : ' and '
                    }
                }
                return result;
            }
        }

        WrappedGL.checkWebGLSupportWithExtensions(
            ['ANGLE_instanced_arrays', 'WEBGL_depth_texture', 'OES_texture_float', 'OES_texture_float_linear', 'OES_texture_half_float', 'OES_texture_half_float_linear'],
            function () {
                document.getElementById('placeholder').outerHTML = document.getElementById('main').innerHTML;
                var windTunnel = new WindParticles();
            },
            function (hasWebGL, unsupportedExtensions) {
                document.getElementById('placeholder').outerHTML = document.getElementById('no-support').innerHTML;
                if (!hasWebGL) {
                    document.getElementById('error').textContent = 'Unfortunately, your browser does not support WebGL';
                } else {
                    document.getElementById('error').textContent = 'Unfortunately, your browser does not support the ' + concatenateWords(unsupportedExtensions) + " WebGL extension" + (unsupportedExtensions.length > 1 ? 's.' : '.');
                }
            }
        );
    </script>
</body>

</html>
